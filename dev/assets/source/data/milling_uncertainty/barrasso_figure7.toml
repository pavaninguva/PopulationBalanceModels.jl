initial_condition = "Figure 7 begins at approximately 7.4 g. One second of the stated feed gives that inventory; its shape is an explicit reconstruction because the complete initial distribution is unavailable. No kinetic parameter was fitted to Figure 7."
deposition = "Positive linear hats for the same continuous daughter density and parent-pivot evaluation. The printed adjacent-pivot cell-average allocation reduces to these hats under that interpretation; this is not a verified copy of the original gPROMS implementation."
median = "Two declared observations of each state: linear interpolation of the cumulative pivot-volume weights in diameter; or the exact volume-weighted CDF of piecewise-constant number density within the auxiliary volume bins. Both include unresolved fines."
scope = "Separate constant-speed forward check. This does not replace or retrospectively validate the retained empty-mill, geometric-grid Bhonsale MC/PCE dataset."
