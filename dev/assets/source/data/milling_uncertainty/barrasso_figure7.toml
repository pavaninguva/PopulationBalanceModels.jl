[interpretation]
equations = "The same feed-breakage-screen residual, physical parameters and numerical builder as the Bhonsale UQ reconstruction. This compares that declared reconstruction with Barrasso Figure 7, rather than copying the original discretization."
grid = "Shared geometric volume grid: 100 pivots, 6.54e-17 to 1e-3 m3. Refinements keep both endpoints fixed. Barrasso's published v_i=v_1*i^6 grid is not used as a separate numerical baseline."
feed = "Exact lognormal bin probabilities, normalized over the common domain and converted to counts at each pivot, identically to UQ."
initial_condition = "Figure 7 begins at approximately 7.4 g. One second of the stated feed gives that inventory; its shape is an explicit reconstruction because the complete initial distribution is unavailable. No kinetic parameter was fitted to Figure 7."
deposition = "The same positive fixed-pivot hats, 8-point Gauss-Legendre daughter quadrature and analytic fines as UQ; not a verified copy of the original gPROMS implementation."
median = "Instantaneous volume-weighted outlet diameter median, with linear diameter interpolation of the cumulative pivot-volume weights and analytic sub-grid fines, identically to UQ."
scope = "The deterministic check and MC/PCE use one numerical forward model. Only the experiment's initial inventory, speed history and duration differ. Partial agreement with Figure 7 does not establish full published-model reproduction."
