name: Optional plotting
on:
  push:
    branches: [main]
  pull_request:
jobs:
  plotting:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10', '1']
    env:
      MPLBACKEND: Agg
      JULIA_CONDAPKG_BACKEND: 'Null'
      JULIA_NUM_THREADS: '1'
      JULIA_NUM_PRECOMPILE_TASKS: '1'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
      # Julia 1.13 / LLVM 20 can crash in VPScalarPHIRecipe while compiling
      # ForwardDiff initial states for the plotting Laplace checks.
      # Keep normal optimization and every assertion with portable code generation.
      JULIA_CPU_TARGET: generic
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: paper/requirements.txt
      - run: python -m pip install -r paper/requirements.txt
      - name: Select one Python interpreter for preparation and tests
        shell: python
        run: |
          import os, sys
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write("JULIA_PYTHONCALL_EXE=" + sys.executable + "\n")
              stream.write("MPLCONFIGDIR=" + os.path.join(os.environ["RUNNER_TEMP"], "matplotlib") + "\n")
      - name: Fetch retained plotting inputs (no numerical calculations)
        run: python tools/retained_data.py fetch --profile plotting-tests
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
        with:
          # A new prefix avoids restoring native images from older plotting jobs.
          cache-name: julia-plotting-source-v1
          cache-compiled: 'false'
      - name: Prepare isolated optional environment
        shell: julia --startup-file=no --cpu-target=generic --color=yes {0}
        run: |
          using Pkg
          using InteractiveUtils
          versioninfo()
          Pkg.activate(joinpath(ENV["RUNNER_TEMP"], "plotting"))
          Pkg.develop(path=pwd())
          Pkg.add(["PythonPlot", "Distributions", "ForwardDiff", "SpecialFunctions",
                   "Optim", "SciMLBase", "Sundials"])
          Pkg.status(;mode=Pkg.PKGMODE_MANIFEST)
          Pkg.precompile(;strict=true)
      - name: Test Julia extension and small tutorial paths
        run: julia --startup-file=no --cpu-target=generic --project="${RUNNER_TEMP}/plotting" test/plotting_integration.jl
      - run: python test/shared_plotting.py
      - run: python test/protein_publication.py
      - run: python test/plotting_summaries.py
      - run: python test/growth_benchmark.py
      - name: Retain resolved plotting environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plotting-environment-${{ matrix.julia }}
          path: |
            ${{ runner.temp }}/plotting/Project.toml
            ${{ runner.temp }}/plotting/Manifest.toml
          if-no-files-found: ignore
