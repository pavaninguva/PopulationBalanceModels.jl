name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10.0', '1.10', '1']
        os: [ubuntu-latest, windows-latest]
        # Julia 1.10.0's libopenlibm requests an executable stack, which the
        # newer glibc on Ubuntu 26.04 rejects before tests can start.
        # https://github.com/JuliaLang/julia/issues/57250
        exclude:
          - version: '1.10.0'
            os: ubuntu-latest
        include:
          - version: '1.10.0'
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Check retained-data download contracts (offline)
        run: python test/retained_data.py
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  extensions:
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    runs-on: ubuntu-latest
    env:
      JULIA_LOAD_PATH: '@:@stdlib'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
      JULIA_NUM_PRECOMPILE_TASKS: '1'
      # Julia 1.13 / LLVM 20 can crash in VPScalarPHIRecipe while compiling
      # dual-valued initial states for mixed stationary/transient inference.
      # Keep normal optimization and every assertion with portable code generation.
      JULIA_CPU_TARGET: generic
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
        with:
          # Keep sources, but rebuild compiler images on the selected Julia.
          cache-name: julia-extensions-source-v1
          cache-compiled: 'false'
      - name: Prepare optional integration environment
        env:
          JULIA_PROJECT: ${{ runner.temp }}/pbm-extensions
        shell: julia --startup-file=no --cpu-target=generic --color=yes {0}
        run: |
          import Pkg
          using InteractiveUtils
          versioninfo()
          root = pwd()
          Pkg.activate(ENV["JULIA_PROJECT"])
          Pkg.develop(path=root)
          Pkg.add(["Optim", "SciMLBase", "OrdinaryDiffEqTsit5", "Distributions", "ForwardDiff", "AdvancedHMC", "MCMCDiagnosticTools", "NonlinearSolve", "Statistics"])
          Pkg.status(;mode=Pkg.PKGMODE_MANIFEST)
          Pkg.precompile(;strict=true)
      # Test in a new process, after dependency activation/precompilation has
      # finished. Keep normal compiler optimization and every derivative test.
      - name: Optional integration tests
        env:
          JULIA_PROJECT: ${{ runner.temp }}/pbm-extensions
        shell: julia --startup-file=no --cpu-target=generic --color=yes {0}
        run: |
          using InteractiveUtils
          versioninfo()
          root = pwd()
          include(joinpath(root,"test","stationary_integration.jl"))
          include(joinpath(root,"test","stationary_inference.jl"))
          include(joinpath(root,"test","tensor_integration.jl"))
          include(joinpath(root,"test","integration.jl"))
          include(joinpath(root,"test","bayesian_integration.jl"))
          include(joinpath(root,"test","protein_parallel.jl"))
      - name: Retain resolved extension environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-environment-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/pbm-extensions/Project.toml
            ${{ runner.temp }}/pbm-extensions/Manifest.toml
          if-no-files-found: ignore
  sensitivities:
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    runs-on: ubuntu-latest
    env:
      JULIA_LOAD_PATH: '@:@stdlib'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
      JULIA_NUM_PRECOMPILE_TASKS: '1'
      # Julia 1.13 / LLVM 20 can crash in VPScalarPHIRecipe while compiling
      # dual-valued initial-state Jacobians on Ice Lake. Use portable code
      # generation, with normal optimization and every derivative assertion.
      # Core jobs still exercise native compilation.
      JULIA_CPU_TARGET: generic
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
        with:
          # New prefix also prevents restoring older archives containing images.
          cache-name: julia-sensitivities-source-v1
          cache-compiled: 'false'
      - name: Prepare sensitivity environment
        env:
          JULIA_PROJECT: ${{ runner.temp }}/pbm-sensitivities
        shell: julia --startup-file=no --cpu-target=generic --color=yes {0}
        run: |
          import Pkg
          using InteractiveUtils
          versioninfo()
          root = pwd()
          Pkg.activate(ENV["JULIA_PROJECT"])
          Pkg.develop(path=root)
          Pkg.add(["Optim", "SciMLBase", "SciMLSensitivity", "ReverseDiff",
                   "OrdinaryDiffEqTsit5", "Distributions", "ForwardDiff"])
          Pkg.status(;mode=Pkg.PKGMODE_MANIFEST)
          Pkg.precompile(;strict=true)
      - name: Continuous forward and adjoint inference tests
        env:
          JULIA_PROJECT: ${{ runner.temp }}/pbm-sensitivities
        shell: julia --startup-file=no --cpu-target=generic --color=yes {0}
        run: |
          using InteractiveUtils
          versioninfo()
          include(joinpath(pwd(),"test","sensitivity_integration.jl"))
      - name: Retain resolved sensitivity environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensitivity-environment-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/pbm-sensitivities/Project.toml
            ${{ runner.temp }}/pbm-sensitivities/Manifest.toml
          if-no-files-found: ignore
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - name: Selected concrete residuals (JET 0.12)
        shell: julia --color=yes {0}
        run: |
          import Pkg
          root = pwd()
          Pkg.activate(mktempdir())
          Pkg.develop(path=root)
          Pkg.add(Pkg.PackageSpec(name="JET", version="0.12"))
          include(joinpath(root,"test","jet.jl"))
