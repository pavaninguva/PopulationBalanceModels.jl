name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Optional integration tests
        shell: julia --color=yes {0}
        run: |
          import Pkg
          root = pwd()
          Pkg.activate(mktempdir())
          Pkg.develop(path=root)
          Pkg.add(["Optim", "SciMLBase", "OrdinaryDiffEqTsit5", "Distributions", "AdvancedHMC", "MCMCDiagnosticTools"])
          include(joinpath(root,"test","integration.jl"))
          include(joinpath(root,"test","bayesian_integration.jl"))
