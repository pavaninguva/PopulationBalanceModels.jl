# Observation assumptions and priors come from the example's active specs.
[production]
bins = 200
Lmax = 50.0
maximum_dt = 2.0
coefficient_interval = 5.0
cfl = 0.35
maxiters = 500
warmup = 300
samples = 500
chains = 4
seed = 20261024
predictive_draws = 200
target_acceptance = 0.90
max_depth = 9

[production.bins_by_model]
cnt = 400
cnt_grd = 200

# Fixed gamma, g in [1,5], constant D0; no old sampler preconditioner is reused.
[production.sampler_by_model.cnt]
warmup = 300
target_acceptance = 0.90

[production.sampler_by_model.cnt_grd]
warmup = 300
target_acceptance = 0.90
max_depth = 10
sampling_coordinates = "initial_rates"
metric_initialization = "expected_information"

[smoke]
bins = 40
Lmax = 50.0
maximum_dt = 1.0
coefficient_interval = 5.0
cfl = 0.35
